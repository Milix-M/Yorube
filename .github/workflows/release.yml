name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit belongs to develop
        run: git merge-base --is-ancestor HEAD origin/develop
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Run tests with 100% line coverage gate
        run: ./gradlew :app:jacocoTestReport :app:jacocoCoverageVerification --no-daemon
      - name: Load private signing key
        env:
          SIGNING_STORE_BASE64: ${{ secrets.YORUBE_SIGNING_STORE_BASE64 }}
        run: |
          test -n "$SIGNING_STORE_BASE64"
          umask 077
          printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yorube-signing.p12"
      - name: Build signed release
        env:
          YORUBE_SIGNING_STORE_FILE: ${{ runner.temp }}/yorube-signing.p12
          YORUBE_SIGNING_STORE_PASSWORD: ${{ secrets.YORUBE_SIGNING_STORE_PASSWORD }}
          YORUBE_SIGNING_KEY_ALIAS: ${{ secrets.YORUBE_SIGNING_KEY_ALIAS }}
          YORUBE_SIGNING_KEY_PASSWORD: ${{ secrets.YORUBE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yorube-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yorube-signing.p12"
