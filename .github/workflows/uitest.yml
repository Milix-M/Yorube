name: ui-test

on:
  workflow_dispatch:

jobs:
  ui-test:
    # Needs hardware acceleration, which the Linux runners lack.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
