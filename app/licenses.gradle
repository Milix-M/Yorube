// Build-time collection only: no runtime dependency or generated UI.
def licenses = extensions.getByName('aboutLibraries')
licenses.collect.filterVariants.add('release')
licenses.collect.includePlatform.set(false)
licenses.export.outputFile.set(file('build/reports/legal/aboutlibraries.json'))
licenses.export.variant.set('release')
licenses.export.prettyPrint.set(true)
licenses.library.duplicationMode.set(Enum.valueOf(licenses.library.duplicationMode.get().class, "KEEP"))
licenses.library.mergePlatformArtifacts.set(false)
licenses.library.requireLicense.set(true)
licenses.license.strictMode.set(Enum.valueOf(licenses.license.strictMode.get().class, "FAIL"))
def policy = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/license-policy.json'))
licenses.license.allowedLicenses.addAll(policy.allowed_spdx_ids)
